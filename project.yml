name: Cliffzy
options:
  bundleIdPrefix: com.cliffzy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Cliffzy:
    type: application
    platform: iOS
    sources:
      - Cliffzy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cliffzy.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cliffzy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent

  CliffzyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CliffzyTests
    dependencies:
      - target: Cliffzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cliffzy:
    build:
      targets:
        Cliffzy: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Cliffzy.storekit
    test:
      targets:
        - CliffzyTests
