name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload a build to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          status=0
          xcodebuild test \
            -project Cliffzy.xcodeproj \
            -scheme Cliffzy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || status=$?
          grep -E "error:|Test Case .* failed|Executed|\*\* .* \*\*" xcodebuild.log | tail -150 || true
          exit $status

      - name: Package simulator app
        if: success()
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent Cliffzy.app "$GITHUB_WORKSPACE/Cliffzy-Simulator.zip"

      - name: Screenshots of every screen
        if: success()
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Cliffzy.app
          mkdir -p screenshots
          for screen in feed series locked episodes paywall discover mylist profile; do
            xcrun simctl terminate "$UDID" com.cliffzy.app || true
            xcrun simctl launch "$UDID" com.cliffzy.app -CliffzyScreen "$screen"
            sleep 9
            xcrun simctl io "$UDID" screenshot "screenshots/$screen.png"
          done
          # The real server (cliffzy-api): the feed with the live catalog.
          xcrun simctl terminate "$UDID" com.cliffzy.app || true
          xcrun simctl launch "$UDID" com.cliffzy.app
          sleep 25
          xcrun simctl io "$UDID" screenshot "screenshots/live-feed.png"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Cliffzy-Screenshots
          path: screenshots

      - name: Publish screenshots to the ci-screenshots branch
        if: success()
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Screenshots for ${{ github.event.pull_request.head.sha || github.sha }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Cliffzy-Simulator
          path: Cliffzy-Simulator.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  # Signed build to TestFlight: on main and on demand, once the App Store Connect API key
  # is in the repository secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) and the Team ID is
  # in project.yml (DEVELOPMENT_TEAM) or the APPLE_TEAM_ID repository variable.
  testflight:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store Connect key
        id: key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::No App Store Connect API key in secrets yet: skipping the TestFlight upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate project
        if: steps.key.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (signed by Xcode with the API key)
        if: steps.key.outputs.ready == 'true'
        run: |
          TEAM_ARG=()
          if [ -n "$TEAM_ID" ]; then TEAM_ARG=(DEVELOPMENT_TEAM="$TEAM_ID"); fi
          xcodebuild archive \
            -project Cliffzy.xcodeproj \
            -scheme Cliffzy \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Cliffzy.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${TEAM_ARG[@]}" \
            > archive.log 2>&1 || { grep -E "error:|warning: .*sign" archive.log | tail -60; exit 1; }
          tail -5 archive.log

      - name: Upload to App Store Connect
        if: steps.key.outputs.ready == 'true'
        run: |
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:Team" "$RUNNER_TEMP/Cliffzy.xcarchive/Info.plist" 2>/dev/null || echo "$TEAM_ID")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cliffzy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. It shows in App Store Connect → TestFlight after Apple processes it (5–30 min)."

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: archive.log
